# 모찌 하네스 — CI 게이트 (GitHub Actions)
# PR/push 시 자동으로 ship-precheck 스크립트 6단계 게이트를 다시 실행.
# 로컬 hook/스크립트 의 실행권한·이식성·동작을 CI 에서 재검증한다 (codex 9차 평가 권고).
#
# 발화 시점:
#   - main 브랜치 push (직접 머지 차단·확인)
#   - feature/fix/docs/chore 브랜치 → main PR (머지 전 자동 게이트)

name: ship-precheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # swift 설치 + CodeGen SPM 빌드(생성물 동기화 §5b) 포함
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # CHANGELOG 등재 검사를 위해 full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Swift
        # ⓪-tier 무결성: 생성 클라이언트(Generated/*.swift)가 openapi.json 과 stale 하지 않은지
        # ship-precheck §5b(generate.sh no-diff)가 검사하려면 swift 가 필요하다.
        # (없으면 §5b 는 graceful skip → 'openapi 갱신 후 generate.sh 누락' 사고를 CI 가 못 막는다.)
        uses: swift-actions/setup-swift@v2

      - name: 백엔드 의존성 설치 (lint/typecheck 도구)
        run: uv sync --frozen
        working-directory: mochi-backend

      - name: 실행 권한 확인
        run: |
          set -e
          for s in .claude/scripts/*.sh .claude/hooks/*.sh; do
            [[ -x "$s" ]] || { echo "❌ $s 실행권한 없음"; exit 1; }
          done
          echo "✅ 모든 hook/script 실행권한 OK"

      - name: audit (전체 docs/journal)
        run: bash .claude/scripts/audit.sh all

      - name: iOS 경계 (TCA 레이어)
        run: bash .claude/scripts/ios-boundaries.sh

      - name: OpenAPI 단일 계약 동기화 (백엔드 code ↔ openapi.json no-diff)
        run: |
          set -e
          # iOS 클라이언트는 openapi.json 에서 생성(swift-openapi-generator)되므로 endpoint/스키마
          # drift 는 구조적으로 불가능(⓪-tier). 여기선 백엔드 코드와 openapi.json 이 어긋나지
          # 않았는지(make openapi 누락 = stale) no-diff 로 검사한다.
          # 생성물(Generated/*.swift) ↔ openapi.json 동기화는 swift 환경이 필요해 로컬
          # ship-precheck §5b(generate.sh no-diff)가 담당한다.
          make -C mochi-backend openapi
          if ! git diff --exit-code -- mochi-backend/openapi.json mochi-ios/Targets/Cores/CoreNetworking/openapi.json; then
            echo "❌ openapi.json 이 백엔드 코드와 stale — make openapi 후 커밋 + CodeGen/generate.sh 재생성 필요."
            exit 1
          fi
          echo "✅ openapi.json 이 백엔드 코드와 동기화됨 (make openapi no-diff)"

      - name: ship-precheck 종합
        run: bash .claude/scripts/ship-precheck.sh all
