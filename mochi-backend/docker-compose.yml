services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mochi
      POSTGRES_PASSWORD: mochi
      POSTGRES_DB: mochi
    ports:
      - "5432:5432"
    volumes:
      - mochi-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mochi -d mochi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mochi-pg:
