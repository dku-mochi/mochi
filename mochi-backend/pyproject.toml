[project]
name = "mochi-backend"
version = "0.1.0"
description = "Mochi — Multimodal AI 기반 스크린샷·링크·기록 통합 에이전트 (백엔드)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Team 세얼간이" },
]
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Settings & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # HTTP client (WebFetch tool, APNs http2)
    "httpx[http2]>=0.27.0",

    # AI — Vertex AI / Gemini
    "google-cloud-aiplatform>=1.71.0",
    "google-genai>=0.3.0",

    # DB — Postgres + pgvector for Hybrid Search RAG
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # Auth — PyJWT + cryptography (PyJWKClient 의 비대칭 키 검증에 필요)
    "pyjwt[crypto]>=2.10.0",

    # Observability / utilities
    "structlog>=24.4.0",
    "tenacity>=9.0.0",

    # Timezone data — Windows 에는 시스템 tzdata 없음
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-PyYAML",
]
lab = [
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "voyageai>=0.4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC"]
ignore = [
    "E501",
    "N999",  # 패키지 디렉토리는 mochi-backend 루트 안의 app/ 만 모듈로 다룸. 루트 폴더명은 PyPI 패키지명 규약(하이픈)을 따른다.
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"__init__.py" = ["F401"]
"app/main.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "tests.*"]
ignore_errors = true
